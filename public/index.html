<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏀 場地搶位控制台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .container { max-width: 640px; margin: 0 auto; padding: 20px 16px 40px; }

    header { text-align: center; padding: 28px 0 20px; }
    header h1 {
      font-size: 26px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    header p { color: #64748b; font-size: 13px; }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: #818cf8; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .hint { font-size: 11px; color: #475569; margin-top: 4px; }

    /* 大按鈕 */
    .btn-join {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-join:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(34,197,94,0.4); }
    .btn-join:active { transform: translateY(0); }

    .btn-now {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
    .btn-now:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }

    /* 任務列表 */
    .job-count {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 12px;
    }
    .job-count span { color: #4ade80; font-weight: 700; }

    .job-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
      position: relative;
    }
    .job-card.running { border-color: #166534; }
    .job-card.completed { border-color: #1e3a5f; }
    .job-card.stopped, .job-card.error { border-color: #3f1215; }
    .job-card.step3_ready { border-color: #4ade80; box-shadow: 0 0 16px rgba(74,222,128,0.2); }

    .job-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .job-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .job-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .running .job-dot { background: #4ade80; animation: pulse 1.5s infinite; }
    .completed .job-dot { background: #60a5fa; }
    .stopped .job-dot, .error .job-dot { background: #f87171; }
    .step3_ready .job-dot { background: #4ade80; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .job-status-text {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .running .job-status-text { background: #052e16; color: #4ade80; }
    .completed .job-status-text { background: #0c1a2e; color: #60a5fa; }
    .stopped .job-status-text, .error .job-status-text { background: #1f0a0b; color: #f87171; }
    .step3_ready .job-status-text { background: #14532d; color: #4ade80; font-size: 13px; }

    .job-log {
      background: #020617;
      border-radius: 6px;
      padding: 10px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: #64748b;
      max-height: 160px;
      overflow-y: auto;
    }
    .job-log::-webkit-scrollbar { width: 4px; }
    .job-log::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }

    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.s { color: #4ade80; }
    .log-line.e { color: #f87171; }
    .log-line.w { color: #fbbf24; }
    .log-line.i { color: #60a5fa; }

    .btn-stop-job {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: transparent;
      border: 1px solid #3f1215;
      border-radius: 6px;
      color: #f87171;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-stop-job:hover { background: #3f1215; }

    .btn-clear {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .btn-clear:hover { border-color: #475569; color: #94a3b8; }

    .step3-banner {
      margin-top: 12px;
      padding: 14px;
      background: linear-gradient(135deg, #14532d, #166534);
      border: 1px solid #4ade80;
      border-radius: 10px;
      text-align: center;
    }
    .step3-banner p {
      font-size: 13px;
      color: #bbf7d0;
      margin-bottom: 10px;
    }
    .btn-step3 {
      display: inline-block;
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #4ade80, #22c55e);
      color: #052e16;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-step3:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(74,222,128,0.5); }

    .empty-state {
      text-align: center;
      padding: 32px 0;
      color: #334155;
      font-size: 14px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .chip {
      padding: 5px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 16px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover, .chip.active { border-color: #818cf8; color: #c7d2fe; background: #1e1b4b; }

    .divider { height: 1px; background: #1e293b; margin: 14px 0; }

    /* 設定區折疊 */
    .collapse-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .collapse-arrow { transition: transform 0.2s; font-size: 12px; color: #475569; }
    .collapsed .collapse-arrow { transform: rotate(-90deg); }
    .collapsible { overflow: hidden; transition: max-height 0.3s ease; }
    .collapsible.hidden { max-height: 0 !important; }

    footer { text-align: center; padding: 16px 0; color: #1e293b; font-size: 11px; }
  </style>
</head>
<body>
<div class="container">

  <header>
    <h1>🏀 場地搶位控制台</h1>
    <p>台北市公有場地租用 — 多人並行搶位系統</p>
  </header>

  <!-- 搶位設定（可折疊） -->
  <div class="card" id="settingsCard">
    <div class="collapse-toggle" onclick="toggleSettings()">
      <div class="card-title" style="margin-bottom:0">⚙️ 搶位設定</div>
      <span class="collapse-arrow" id="settingsArrow">▼</span>
    </div>

    <div class="collapsible" id="settingsBody" style="max-height: 2000px;">
      <div style="height:16px"></div>

      <div class="form-group">
        <label>場地 ID</label>
        <input type="text" id="venueId" value="27ee824a3be0" placeholder="例: 27ee824a3be0">
        <div class="hint">從預約網址中取得，例: .../VenueDetail/<b>27ee824a3be0</b></div>
      </div>

      <div class="form-group">
        <label>目標時段（需與網頁按鈕完全一致）</label>
        <input type="text" id="targetDateText" value="2026/07/07(二) 20:00~22:00">
        <div class="chip-row" id="presetChips">
          <div class="chip" data-time="08:00~10:00">08~10</div>
          <div class="chip" data-time="16:00~18:00">16~18</div>
          <div class="chip" data-time="18:00~20:00">18~20</div>
          <div class="chip active" data-time="20:00~22:00">20~22</div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>目標月份</label>
          <select id="targetMonth">
            <option value="1">1 月</option><option value="2">2 月</option>
            <option value="3">3 月</option><option value="4">4 月</option>
            <option value="5">5 月</option><option value="6">6 月</option>
            <option value="7" selected>7 月</option><option value="8">8 月</option>
            <option value="9">9 月</option><option value="10">10 月</option>
            <option value="11">11 月</option><option value="12">12 月</option>
          </select>
        </div>
        <div class="form-group">
          <label>目標日期</label>
          <input type="number" id="targetDay" value="7" min="1" max="31">
        </div>
      </div>

      <div class="divider"></div>

      <div class="form-row">
        <div class="form-group">
          <label>搶位日期</label>
          <input type="date" id="executeDate" value="2026-06-06">
        </div>
        <div class="form-group">
          <label>搶位時間</label>
          <input type="time" id="executeTime" value="00:00" step="1">
        </div>
      </div>
      <div class="hint" style="margin-top:-8px">⏰ Bot 會在這個時間精準開始搶 Step 2 時段按鈕</div>
    </div>
  </div>

  <!-- 加入搶位 -->
  <div class="card">
    <div class="card-title">🚀 加入搶位</div>
    <button class="btn-join" onclick="joinQueue(false)">⏰ 加入排程搶位</button>
    <button class="btn-now" onclick="joinQueue(true)">⚡ 立即測試（跳過等待）</button>
    <div class="hint" style="margin-top:10px; text-align:center">
      每按一次 = 多一個 Bot 實例同時搶，人越多中的機率越高
    </div>
  </div>

  <!-- 搶位任務清單 -->
  <div class="card">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <div class="card-title" style="margin-bottom:0">📋 搶位任務</div>
      <button class="btn-clear" style="width:auto; padding:6px 12px; margin-top:0" onclick="clearDone()">清除已完成</button>
    </div>

    <div id="jobsContainer">
      <div class="empty-state">還沒有任何搶位任務<br>按上方按鈕開始！</div>
    </div>
  </div>

  <footer>Auto Book BBall Court v2.0</footer>
</div>

<script>
  // ====== 設定折疊 ======
  function toggleSettings() {
    const body = document.getElementById('settingsBody');
    const arrow = document.getElementById('settingsArrow');
    const card = document.getElementById('settingsCard');
    const isOpen = body.style.maxHeight !== '0px';
    body.style.maxHeight = isOpen ? '0px' : '2000px';
    arrow.style.transform = isOpen ? 'rotate(-90deg)' : '';
  }

  // ====== 時段快捷 ======
  document.getElementById('presetChips').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    const input = document.getElementById('targetDateText');
    input.value = input.value.replace(/\d{2}:\d{2}~\d{2}:\d{2}/, chip.dataset.time);
  });

  // ====== 加入搶位 ======
  async function joinQueue(runNow) {
    const config = {
      venueId:        document.getElementById('venueId').value.trim(),
      targetDateText: document.getElementById('targetDateText').value.trim(),
      targetMonth:    document.getElementById('targetMonth').value,
      targetDay:      document.getElementById('targetDay').value,
      executeDate:    document.getElementById('executeDate').value,
      executeTime:    document.getElementById('executeTime').value,
      runNow,
    };

    if (!config.venueId || !config.targetDateText) {
      alert('請填寫場地 ID 和目標時段');
      return;
    }

    try {
      const res = await fetch('/api/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(config),
      });
      const data = await res.json();
      if (!res.ok) { alert(data.error || '啟動失敗'); return; }
      // 成功後收起設定卡
      const body = document.getElementById('settingsBody');
      if (body.style.maxHeight !== '0px') toggleSettings();
    } catch (err) {
      alert('無法連線到伺服器: ' + err.message);
    }
  }

  // ====== 停止特定任務 ======
  async function stopJob(jobId) {
    if (!confirm('確定要停止這個任務？')) return;
    await fetch(`/api/stop/${jobId}`, { method: 'POST' }).catch(() => {});
  }

  // ====== 清除已完成 ======
  async function clearDone() {
    await fetch('/api/clear', { method: 'POST' }).catch(() => {});
  }

  // ====== 日誌顏色分類 ======
  function logClass(line) {
    if (line.includes('✅') || line.includes('🎊')) return 's';
    if (line.includes('❌') || line.includes('錯誤') || line.includes('失敗')) return 'e';
    if (line.includes('⚠️')) return 'w';
    if (line.includes('🔍') || line.includes('📅') || line.includes('🎯')) return 'i';
    return '';
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function statusLabel(s) {
    const map = { running: '搶位中', completed: '已完成', stopped: '已停止', error: '錯誤', step3_ready: '搶到了！' };
    return map[s] || s;
  }

  // ====== 渲染任務卡 ======
  function renderJobs(jobs) {
    const container = document.getElementById('jobsContainer');
    if (jobs.length === 0) {
      container.innerHTML = '<div class="empty-state">還沒有任何搶位任務<br>按上方按鈕開始！</div>';
      return;
    }

    container.innerHTML = jobs.map((job, idx) => {
      const logs = job.logs.slice(-30);
      const logHtml = logs.map(l => `<div class="log-line ${logClass(l)}">${esc(l)}</div>`).join('');
      const stopBtn = job.status === 'running'
        ? `<button class="btn-stop-job" onclick="stopJob('${job.id}')">⏹ 停止這個 Bot</button>`
        : '';
      const step3Banner = job.step3Url
        ? `<div class="step3-banner">
            <p>🎊 搶到時段了！請在 <b>10 分鐘內</b>點下方按鈕完成填表，逾時 session 可能失效</p>
            <a class="btn-step3" href="${job.step3Url}" target="_blank" rel="noopener">🏀 開啟 Step 3 填寫申請表</a>
           </div>`
        : '';
      return `
        <div class="job-card ${job.status}">
          <div class="job-header">
            <div class="job-label">
              <div class="job-dot"></div>
              Bot #${idx + 1}
            </div>
            <span class="job-status-text">${statusLabel(job.status)}</span>
          </div>
          <div class="job-log" id="log_${job.id}">${logHtml}</div>
          ${step3Banner}
          ${stopBtn}
        </div>`;
    }).join('');

    // 自動捲到每個 log 底部
    jobs.forEach(job => {
      const el = document.getElementById(`log_${job.id}`);
      if (el) el.scrollTop = el.scrollHeight;
    });
  }

  // ====== 定時輪詢 ======
  async function poll() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      renderJobs(data.jobs || []);
    } catch {}
  }

  setInterval(poll, 1000);
  poll();
</script>
</body>
</html>
