<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>場地搶位 Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Title bar drag area ── */
    .titlebar {
      -webkit-app-region: drag;
      height: 40px;
      background: #0f1117;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .titlebar h1 {
      font-size: 14px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 20px 16px;
      overflow: hidden;
      gap: 14px;
    }

    /* ── Status bar ── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1c1e26;
      border-radius: 10px;
      padding: 10px 16px;
      flex-shrink: 0;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4b5563;
    }
    .status-dot.idle     { background: #4b5563; }
    .status-dot.waiting  { background: #3b82f6; box-shadow: 0 0 6px #3b82f6; animation: pulse 1.5s infinite; }
    .status-dot.running  { background: #f59e0b; box-shadow: 0 0 6px #f59e0b; animation: pulse 0.8s infinite; }
    .status-dot.completed{ background: #22c55e; box-shadow: 0 0 6px #22c55e; }
    .status-dot.error    { background: #ef4444; }
    .status-dot.stopped  { background: #4b5563; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .countdown {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #3b82f6;
      letter-spacing: 0.05em;
      display: none;
    }
    .countdown.visible { display: block; }

    /* ── Config form ── */
    .config-card {
      background: #1c1e26;
      border-radius: 10px;
      padding: 14px 16px;
      flex-shrink: 0;
    }

    .config-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .config-grid .full { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #3b82f6; }
    input:disabled { opacity: 0.4; cursor: not-allowed; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

    /* ── Checkbox ── */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .checkbox-row input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .checkbox-row span {
      font-size: 13px;
      color: #94a3b8;
    }

    /* ── Buttons ── */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.35; cursor: not-allowed; }

    #startBtn {
      background: #2563eb;
      color: #fff;
    }
    #startBtn:hover:not(:disabled) { background: #1d4ed8; }

    #stopBtn {
      background: #1f2937;
      color: #e2e8f0;
      border: 1px solid #374151;
    }
    #stopBtn:hover:not(:disabled) { background: #374151; }

    /* ── Log area ── */
    .log-card {
      background: #1c1e26;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid #2d3148;
      flex-shrink: 0;
    }
    .log-header span { font-size: 12px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; }

    #clearLogBtn {
      background: none;
      border: none;
      color: #475569;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 6px;
      flex: none;
    }
    #clearLogBtn:hover { color: #94a3b8; }

    #logOutput {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      line-height: 1.7;
      color: #94a3b8;
    }
    #logOutput::-webkit-scrollbar { width: 4px; }
    #logOutput::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 2px; }

    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.success { color: #22c55e; }
    .log-line.error   { color: #ef4444; }
    .log-line.warn    { color: #f59e0b; }
    .log-line.info    { color: #3b82f6; }

    /* ── Step3 banner ── */
    #step3Banner {
      display: none;
      background: #14532d;
      border: 1px solid #22c55e;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #86efac;
    }
    #step3Banner.visible { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #step3Banner a { color: #4ade80; font-weight: 600; text-decoration: none; word-break: break-all; }

    /* ── Disclaimer ── */
    .disclaimer {
      background: #1c1008;
      border: 1px solid #78350f;
      border-left: 4px solid #f59e0b;
      border-radius: 8px;
      padding: 10px 14px;
      flex-shrink: 0;
    }
    .disclaimer-title {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
      margin-bottom: 6px;
    }
    .disclaimer ul {
      margin: 0;
      padding-left: 14px;
      font-size: 11px;
      line-height: 1.7;
    }
    .disclaimer ul li { color: #fcd34d; opacity: 0.8; }
  </style>
</head>
<body>
  <div class="titlebar">
    <h1>🏀 場地搶位 Agent</h1>
  </div>

  <div class="main">

    <!-- 免責聲明 -->
    <div class="disclaimer">
      <div class="disclaimer-title">⚠️ 免責聲明</div>
      <ul>
        <li>本工具僅供個人學習與研究用途，請勿用於商業牟利或大規模濫用。</li>
        <li>使用本工具即表示您已閱讀並同意遵守台北市政府場地租借系統之使用規範。</li>
        <li>自動化操作可能違反網站服務條款，使用者須自行承擔一切法律責任。</li>
        <li>開發者不對任何因使用本工具而產生之損失、帳號停用或法律糾紛負責。</li>
        <li>請合理使用，切勿因大量並行 Bot 造成政府網站服務中斷。</li>
      </ul>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-badge">
        <div class="status-dot idle" id="statusDot"></div>
        <span id="statusText">待機中</span>
      </div>
      <div class="countdown" id="countdown">--:--:--</div>
    </div>

    <!-- Config -->
    <div class="config-card">
      <div class="config-grid">
        <div class="full">
          <label>場地 ID (Venue ID)</label>
          <input type="text" id="venueId" value="27ee824a3be0" placeholder="27ee824a3be0" />
        </div>
        <div class="full">
          <label>目標時段 (alldate 格式)</label>
          <input type="text" id="targetDateText" value="2026/07/07(二) 20:00~22:00" />
        </div>
        <div>
          <label>目標月份</label>
          <input type="text" id="targetMonth" value="7" placeholder="7" />
        </div>
        <div>
          <label>目標日期</label>
          <input type="text" id="targetDay" value="7" placeholder="7" />
        </div>
        <div>
          <label>並行 Bot 數</label>
          <input type="text" id="numBots" value="2" placeholder="2" />
        </div>
        <div>
          <label>執行日期</label>
          <input type="date" id="executeDate" value="2026-06-06" />
        </div>
        <div>
          <label>執行時間</label>
          <input type="time" id="executeTime" value="00:00" step="1" />
        </div>
      </div>

      <div class="checkbox-row" style="margin-top: 12px;">
        <input type="checkbox" id="runNow" />
        <span>立即執行（測試用，略過倒數）</span>
      </div>

      <div class="btn-row">
        <button id="startBtn">▶ 開始搶位</button>
        <button id="stopBtn" disabled>■ 停止</button>
      </div>
    </div>

    <!-- Step3 banner -->
    <div id="step3Banner">
      <span>🎊 搶到了！請在瀏覽器完成 Step 3：</span>
      <a id="step3Link" href="#" target="_blank"></a>
    </div>

    <!-- Log -->
    <div class="log-card">
      <div class="log-header">
        <span>執行日誌</span>
        <button id="clearLogBtn">清除</button>
      </div>
      <div id="logOutput"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
